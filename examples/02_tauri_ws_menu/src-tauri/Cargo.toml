[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["Kitware"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-shell = "2.5.0"                                # Added sidecar
async-std = "1.12.0"                                        # Added for sleep 
